name: preza
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:${LISTEN_PORT:-18480}:8000"
    environment:
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:18480}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?Set ADMIN_ACCESS_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Generate SESSION_SECRET in .env}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-300}
    volumes:
      - presentation_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=300m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
volumes:
  presentation_data:
    name: ${DATA_VOLUME:-preza_presentation_data}
