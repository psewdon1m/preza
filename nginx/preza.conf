# Separate vhost for the existing server-managed Nginx.
# Install only after preza-install and the loopback health check succeed.
# LISTEN_PORT is 18480 by default. Change the upstream here if selecting another.
# TLS material and active placement are owned by the server operator.
server {
    listen 80;
    listen [::]:80;
    server_name preza.shmoza.net;
    return 301 https://preza.shmoza.net$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preza.shmoza.net;
    ssl_certificate /etc/letsencrypt/live/preza.shmoza.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preza.shmoza.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 257m;
    client_body_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'" always;
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:18480;
    }
    location ~ ^/api/p/[a-f0-9]+/events$ {
        proxy_pass http://127.0.0.1:18480;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/(?:\.git|\.env|\.secrets|data|source|slides|presentations|docs)(?:/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
